<title>Испанский A1 — Тренажёры по темам</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
      }
  .card {
    background: #fff; border-radius: 20px; padding: 32px 26px;
    max-width: 580px; width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  h1 { font-size: 1.4rem; color: #333; text-align: center; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 20px; }

  /* Меню тем */
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .menu button {
    padding: 16px 10px; border: 2px solid #ddd; border-radius: 14px;
    background: #fafafa; font-size: 0.95rem; cursor: pointer;
    font-family: inherit; transition: all 0.2s; text-align: center;
    font-weight: 600; color: #444; line-height: 1.4;
  }
  .menu button:hover { border-color: #764ba2; background: #f3f0ff; transform: translateY(-2px); }
  .menu button .emoji { display: block; font-size: 1.6rem; margin-bottom: 4px; }

  .progress { height: 8px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.4s ease; }

  .topic-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid #f0ebff;
  }
  .topic-header h2 { font-size: 1.1rem; color: #764ba2; }
  .back-btn {
    padding: 6px 12px; border: 2px solid #ddd; border-radius: 10px;
    background: #fafafa; font-size: 0.85rem; cursor: pointer;
    font-family: inherit; color: #666; transition: all 0.2s;
  }
  .back-btn:hover { border-color: #764ba2; color: #764ba2; }

  .question { font-size: 1.2rem; color: #222; margin-bottom: 18px; line-height: 1.7; min-height: 60px; }
  .word { cursor: help; border-bottom: 1px dotted #aaa; transition: background 0.15s; }
  .word:hover { background: #f0ebff; border-radius: 3px; }
  .blank { color: #764ba2; font-weight: bold; border-bottom: 2px dashed #764ba2; padding: 0 6px; }

  .options { display: grid; gap: 10px; }
  .option {
    padding: 13px 18px; border: 2px solid #ddd; border-radius: 12px;
    background: #fafafa; font-size: 1rem; cursor: pointer;
    transition: all 0.2s ease; text-align: left; font-family: inherit;
  }
  .option:hover:not(:disabled) { border-color: #764ba2; background: #f3f0ff; transform: translateX(4px); }
  .option.correct { border-color: #2ecc71; background: #e8f8ef; color: #1a7a45; font-weight: bold; }
  .option.wrong { border-color: #e74c3c; background: #fdecea; color: #b03024; }
  .option:disabled { cursor: default; }

  .feedback { margin-top: 14px; font-size: 1rem; text-align: center; min-height: 24px; font-weight: bold; }
  .feedback.ok { color: #2ecc71; }
  .feedback.no { color: #e74c3c; }

  .ai-box {
    margin-top: 14px; padding: 13px 16px; border-radius: 12px;
    background: #f3f0ff; border-left: 4px solid #764ba2;
    font-size: 0.93rem; color: #444; line-height: 1.5; display: none;
  }
  .ai-box.show { display: block; animation: fadeIn 0.3s ease; }
  .ai-box b { color: #764ba2; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }

  .footer { display: flex; justify-content: space-between; margin-top: 20px; color: #666; font-size: 0.9rem; }
  .score { font-weight: bold; color: #764ba2; }

  .restart {
    display: none; width: 100%; margin-top: 16px; padding: 14px; border: none;
    border-radius: 12px; background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
    font-family: inherit; transition: opacity 0.2s;
  }
  .restart:hover { opacity: 0.9; }
  .result { text-align: center; padding: 20px 0; }
  .result .big { font-size: 3rem; font-weight: bold; color: #764ba2; margin: 10px 0; }
  .result p { color: #666; font-size: 1.1rem; }

  .tooltip {
    position: fixed; background: #222; color: #fff; padding: 5px 10px;
    border-radius: 6px; font-size: 0.85rem; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; z-index: 100; white-space: nowrap;
  }
  .tooltip.show { opacity: 1; }
</style>
</head>

   ============================================================ */
let currentTopic = null;
let quiz = [];
let current = 0;
let score = 0;
const TOTAL = 8;

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function wrapWords(text) {
  return text.split(' ').map(token => {
    if (token.includes('___')) {
      return token.replace('___', '<span class="blank">___</span>');
    }
    const clean = token.replace(/[.,!?¿¡"'«»]/g, '').toLowerCase();
    if (dictionary[clean]) {
      const punct = token.match(/[.,!?¿¡"'«»]+$/);
      const p = punct ? punct[0] : '';
      const base = token.replace(/[.,!?¿¡"'«»]+$/, '');
      return `<span class="word" data-tr="${dictionary[clean]}">${base}</span>${p}`;
    }
    return token;
  }).join(' ');
}

/* ============================================================
   МЕНЮ
   ============================================================ */
function showMenu() {
  document.getElementById('menu').style.display = 'grid';
  document.getElementById('topicHeader').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('footer').style.display = 'none';
  document.getElementById('restart').style.display = 'none';
  document.getElementById('subtitle').textContent = 'Выбери тренажёр. Наведи на слово — увидишь перевод.';
}

function renderMenu() {
  const menu = document.getElementById('menu');
  menu.innerHTML = '';
  Object.keys(TOPICS).forEach(key => {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="emoji">${TOPICS[key].name.split(' ')[0]}</span>${TOPICS[key].name.split(' ').slice(1).join(' ')}`;
    btn.onclick = () => startTopic(key);
    menu.appendChild(btn);
  });
}

/* ============================================================
   СТАРТ ТЕМЫ
   ============================================================ */
function startTopic(key) {
  currentTopic = key;
  const topic = TOPICS[key];

  quiz = shuffle(topic.data).slice(0, TOTAL).map(q => ({
    ...q,
    options: shuffle(q.options)
  }));
  current = 0;
  score = 0;

  document.getElementById('menu').style.display = 'none';
  document.getElementById('topicHeader').style.display = 'flex';
  document.getElementById('topicTitle').textContent = topic.name;
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  document.getElementById('footer').style.display = 'flex';
  document.getElementById('restart').style.display = 'none';
  document.getElementById('subtitle').textContent = 'Тренажёр: ' + topic.name;
  document.getElementById('score').textContent = '0';
  document.getElementById('total').textContent = Math.min(TOTAL, topic.data.length);

  loadQuestion();
}

/* ============================================================
   ВОПРОС
   ============================================================ */
function loadQuestion() {
  const q = quiz[current];
  document.getElementById('current').textContent = current + 1;
  document.getElementById('question').innerHTML = wrapWords(q.text);
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('aiBox').classList.remove('show');

  const box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt, q);
    box.appendChild(btn);
  });

  updateBar();
  attachTooltips();
}

/* ============================================================
   ПРОВЕРКА
   ============================================================ */
function checkAnswer(btn, chosen, q) {
  document.querySelectorAll('.option').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  if (chosen === q.correct) {
    score++;
    document.getElementById('score').textContent = score;
    fb.textContent = '✅ ¡Correcto! Правильно';
    fb.classList.add('ok');
  } else {
    btn.classList.add('wrong');
    fb.textContent = '❌ Incorrecto. Правильно: ' + q.correct;
    fb.classList.add('no');
  }

  const ai = document.getElementById('aiBox');
  ai.innerHTML = '🤖  <b>Почему:</b> ' + q.why;
  ai.classList.add('show');

  setTimeout(() => {
    current++;
    if (current < quiz.length) loadQuestion();
    else showResult();
  }, 3200);
}

function updateBar() {
  document.getElementById('bar').style.width = (current / quiz.length) * 100 + '%';
}
/* ============================================================
   РЕЗУЛЬТАТ
   ============================================================ */
function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('footer').style.display = 'none';
  document.getElementById('restart').style.display = 'block';
  document.getElementById('bar').style.width = '100%';

  const percent = Math.round((score / quiz.length) * 100);
  let emoji, msg;
  if (percent === 100) { emoji = '🏆'; msg = '¡Perfecto! Идеально!'; }
  else if (percent >= 70) { emoji = '🎉 '; msg = '¡Muy bien! Отличный результат!'; }
  else if (percent >= 40) { emoji = '💪 '; msg = 'Bien, sigue practicando. Практикуйся ещё!'; }
  else { emoji = '📚'; msg = 'Sigue estudiando. Продолжай учиться!'; }

  const r = document.getElementById('result');
  r.style.display = 'block';
  r.innerHTML = `<div style="font-size:3rem;">${emoji}</div>
    <div class="big">${score} / ${quiz.length}</div>
    <p>${msg}</p>`;
}

/* ============================================================
   ПОДСКАЗКИ
   ============================================================ */
const tooltip = document.getElementById('tooltip');
function attachTooltips() {
  document.querySelectorAll('.word').forEach(el => {
    el.addEventListener('mouseenter', () => {
      tooltip.textContent = el.dataset.tr;
      tooltip.classList.add('show');
      const r = el.getBoundingClientRect();
      tooltip.style.left = r.left + 'px';
      tooltip.style.top = (r.top - 32) + 'px';
    });
    el.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  });
}

/* ============================================================
   КНОПКА "ЗАНОВО" — перезапускает ТОЛЬКО текущую тему
   ============================================================ */
document.getElementById('restart').onclick = () => {
  if (currentTopic) startTopic(currentTopic);
};

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
renderMenu();
showMenu();
</script>
</body>
</html>
